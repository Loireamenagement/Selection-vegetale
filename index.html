<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3D30">
<title>Sélection végétale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#F3F2EC; --carte:#FBFAF6; --encre:#14201A; --encre-2:#5A6660;
  --vert:#1F3D30; --mousse:#6F8F3F; --ocre:#C4892C; --ligne:#D8D6CC;
  --ombre:0 1px 2px rgba(20,32,26,.06), 0 8px 24px rgba(20,32,26,.06);
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--papier); color:var(--encre);
  font:400 15px/1.5 Archivo,system-ui,sans-serif;
  overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.lat{font-family:Spectral,Georgia,serif;font-style:italic}

/* ---------- structure ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{
  display:flex;align-items:center;gap:16px;padding:12px 20px;
  background:var(--vert);color:#EDF0EA;flex:0 0 auto;
}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
header .sub{font-size:12px;color:#A9BBAF;margin-left:-8px}
.spacer{flex:1}
.hbtn{
  display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;
  background:rgba(255,255,255,.12);font-size:13px;font-weight:500;
}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn .count{
  background:var(--ocre);color:#1a1408;border-radius:99px;
  min-width:20px;height:20px;display:grid;place-items:center;
  font-size:11px;font-weight:700;padding:0 5px;
}
main{flex:1;display:flex;min-height:0}

/* ---------- filtres ---------- */
#filtres{
  flex:0 0 268px;overflow-y:auto;padding:16px 16px 40px;
  border-right:1px solid var(--ligne);background:var(--carte);
}
.fgroup{margin-bottom:18px}
.flabel{
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--encre-2);margin-bottom:8px;display:block;
}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  padding:7px 11px;border-radius:7px;background:#EDEBE2;
  font-size:12.5px;line-height:1.1;border:1px solid transparent;
}
.chip:hover{background:#E4E1D6}
.chip.on{background:var(--vert);color:#F1F3EE;border-color:var(--vert)}
.chip.mois{min-width:34px;text-align:center;padding:7px 6px}
.chip.mois.on{background:var(--ocre);color:#1a1408}
input[type=search]{
  width:100%;padding:11px 12px;border:1px solid var(--ligne);border-radius:8px;
  background:#fff;font:inherit;font-size:14px;
}
input[type=range]{width:100%;accent-color:var(--mousse);margin:4px 0}
.rangeval{font-size:12.5px;color:var(--encre-2);display:flex;justify-content:space-between}
.rangeval b{color:var(--encre);font-weight:600}
#reset{
  width:100%;padding:10px;border:1px solid var(--ligne);border-radius:8px;
  font-size:13px;color:var(--encre-2);
}
#reset:hover{background:#EDEBE2;color:var(--encre)}

/* ---------- resultats ---------- */
#resultats{flex:1;overflow-y:auto;padding:16px 20px 60px}
.barre{
  display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
  position:sticky;top:-16px;background:var(--papier);padding:6px 0 10px;z-index:5;
}
.barre .n{font-size:20px;font-weight:700}
.barre .t{font-size:13px;color:var(--encre-2)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.carte{
  background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);
  padding:13px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:7px;
  transition:border-color .12s, transform .12s, box-shadow .12s;
}
.carte:hover{border-color:var(--mousse);box-shadow:var(--ombre);transform:translateY(-1px)}
.carte .nom{font-size:16px;font-weight:600;line-height:1.25}
.carte .lat{font-size:13px;color:var(--encre-2)}
.carte .meta{font-size:12px;color:var(--encre-2);display:flex;flex-wrap:wrap;gap:4px 10px}
.carte .prix{font-size:13px;font-weight:600;margin-top:auto;padding-top:4px}
.carte .prix span{font-weight:400;color:var(--encre-2)}
.vide{padding:48px 8px;text-align:center;color:var(--encre-2);max-width:420px}
.vide b{display:block;color:var(--encre);font-size:16px;margin-bottom:6px}

/* ---------- frise floraison ---------- */
.frise{display:flex;gap:2px;height:7px}
.frise i{flex:1;background:#E4E1D6;border-radius:2px}
.frise i.on{background:var(--ocre)}
.frise-lab{display:flex;gap:2px;font-size:9px;color:var(--encre-2);margin-top:3px}
.frise-lab span{flex:1;text-align:center}

/* ---------- favoris ---------- */
.cwrap{position:relative;display:flex}
.cwrap>.carte{flex:1}
.star{
  position:absolute;top:7px;right:7px;width:32px;height:32px;border-radius:8px;
  display:grid;place-items:center;font-size:16px;line-height:1;
  color:#C2BEB0;background:rgba(251,250,246,.9);
}
.star:hover{background:#EDEBE2;color:var(--ocre)}
.star.on{color:var(--ocre)}
#pop{
  position:fixed;z-index:70;background:var(--carte);border:1px solid var(--ligne);
  border-radius:10px;box-shadow:var(--ombre);padding:6px;min-width:212px;display:none;
}
#pop.on{display:block}
#pop .ptit{
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--encre-2);padding:7px 9px 6px;
}
#pop button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:9px 9px;border-radius:7px;font-size:13.5px;
}
#pop button:hover{background:#EDEBE2}
#pop button .tick{width:15px;color:var(--mousse);font-weight:700}
#pop .neuf{border-top:1px solid var(--ligne);margin-top:4px;padding-top:4px;color:var(--mousse);font-weight:600}
#favoris{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);
  background:var(--carte);z-index:60;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s ease;
  box-shadow:-8px 0 40px rgba(20,32,26,.16);
}
#favoris.on{transform:none}
.coll{border-bottom:1px solid var(--ligne);padding:14px 0}
.coll:last-child{border-bottom:0}
.chead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.chead h4{margin:0;font-size:15.5px;font-weight:700}
.chead .n{font-size:12px;color:var(--encre-2)}
.chead .all{margin-left:auto;font-size:12px;color:var(--mousse);font-weight:600;text-decoration:underline}
.fitem{display:flex;align-items:center;gap:9px;padding:7px 0}
.fitem .txt2{flex:1;min-width:0}
.fitem .n1{font-size:14px;font-weight:500;line-height:1.2}
.fitem .n2{font-size:11.5px;color:var(--encre-2)}
.fitem .mini{
  padding:6px 10px;border-radius:6px;border:1px solid var(--ligne);
  font-size:12px;font-weight:600;background:#fff;white-space:nowrap;
}
.fitem .mini:hover{background:var(--vert);color:#F1F3EE;border-color:var(--vert)}
.fitem .x{color:#C2BEB0;font-size:15px;padding:4px 6px}
.fitem .x:hover{color:#B3462C}
.newcoll{
  width:100%;padding:11px;border:1px dashed var(--ligne);border-radius:8px;
  font-size:13px;color:var(--encre-2);margin-top:14px;
}
.newcoll:hover{border-color:var(--mousse);color:var(--mousse)}

/* ---------- fiche ---------- */
#voile{
  position:fixed;inset:0;background:rgba(20,32,26,.4);
  display:none;z-index:40;backdrop-filter:blur(2px);
}
#voile.on{display:block}
#fiche{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);
  background:var(--carte);z-index:50;overflow-y:auto;
  transform:translateX(100%);transition:transform .22s ease;
  box-shadow:-8px 0 40px rgba(20,32,26,.16);
}
#fiche.on{transform:none}
.fhead{
  padding:20px 24px 16px;border-bottom:1px solid var(--ligne);
  position:sticky;top:0;background:var(--carte);z-index:2;
}
.fhead .fr{font-size:24px;font-weight:700;line-height:1.15}
.fhead .lat{font-size:16px;color:var(--encre-2);margin-top:2px}
.fclose{
  position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:8px;
  background:#EDEBE2;font-size:18px;line-height:1;
}
.fbody{padding:18px 24px 40px}
.fsec{margin-bottom:22px}
.fsec h3{
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--encre-2);margin:0 0 10px;
}
.paires{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ligne);
  border:1px solid var(--ligne);border-radius:8px;overflow:hidden}
.paire{background:var(--carte);padding:9px 12px}
.paire dt{font-size:11px;color:var(--encre-2);margin-bottom:2px}
.paire dd{margin:0;font-size:14px;font-weight:500}
.txt{font-size:14.5px;line-height:1.55}
.txt.gris{color:var(--encre-2)}
.pastilles{display:flex;flex-wrap:wrap;gap:6px}
.past{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border:1px solid var(--ligne);border-radius:99px;font-size:12.5px;background:#fff;
}
.past i{width:10px;height:10px;border-radius:99px;display:block;border:1px solid rgba(0,0,0,.12)}
.calc{background:#EFEDE4;border:1px solid var(--ligne);border-radius:8px;padding:12px 13px;margin-bottom:12px}
.calc-row{display:flex;align-items:flex-end;gap:10px}
.calc-row label{flex:1;font-size:11px;color:var(--encre-2);display:flex;flex-direction:column;gap:4px}
.calc-row input{
  width:100%;padding:9px 10px;border:1px solid var(--ligne);border-radius:7px;
  background:#fff;font:inherit;font-size:14px;
}
.calc-row .ou{font-size:12px;color:var(--encre-2);padding-bottom:11px}
.calc-out{font-size:13px;margin-top:9px;line-height:1.45}
.calc-out b{font-size:15px}
table.cal{width:100%;border-collapse:collapse;font-size:13.5px}
table.cal th{
  text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--encre-2);font-weight:700;padding:0 8px 7px;
}
table.cal td{padding:9px 8px;border-top:1px solid var(--ligne);vertical-align:middle}
table.cal td.px{font-weight:600;white-space:nowrap}
.add{
  padding:7px 13px;border-radius:7px;background:var(--vert);color:#F1F3EE;
  font-size:12.5px;font-weight:600;white-space:nowrap;
}
.add:hover{background:#2A5341}
.add.ok{background:var(--mousse);color:#12200A}
.alerte{
  background:#FDF6E7;border:1px solid #EBD9AE;border-radius:8px;
  padding:11px 13px;font-size:13.5px;line-height:1.5;
}

/* ---------- panier ---------- */
#panier{
  position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);
  background:var(--carte);z-index:60;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s ease;
  box-shadow:-8px 0 40px rgba(20,32,26,.16);
}
#panier.on{transform:none}
.phead{padding:18px 22px;border-bottom:1px solid var(--ligne);display:flex;align-items:center}
.phead h2{margin:0;font-size:19px;font-weight:700}
.plist{flex:1;overflow-y:auto;padding:14px 22px}
.pitem{padding:12px 0;border-bottom:1px solid var(--ligne);display:flex;gap:12px}
.pitem .info{flex:1;min-width:0}
.pitem .nom{font-size:14.5px;font-weight:600}
.pitem .det{font-size:12px;color:var(--encre-2);margin-top:2px}
.qty{display:flex;align-items:center;gap:2px;margin-top:7px}
.qty button{
  width:29px;height:29px;border:1px solid var(--ligne);background:#fff;
  border-radius:6px;font-size:15px;line-height:1;
}
.qty button:hover{background:#EDEBE2}
.qty input{
  width:46px;height:29px;text-align:center;border:1px solid var(--ligne);
  border-radius:6px;font:inherit;font-size:13px;margin:0 3px;
}
.pitem .tot{font-size:14px;font-weight:600;white-space:nowrap;text-align:right}
.sup{font-size:11.5px;color:var(--encre-2);margin-top:6px;text-decoration:underline}
.pfoot{border-top:1px solid var(--ligne);padding:16px 22px;background:#EFEDE4}
.ligne-tot{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.ligne-tot.grand{font-size:19px;font-weight:700;margin:9px 0 14px}
.envoyer{
  width:100%;padding:14px;border-radius:9px;background:var(--vert);color:#F1F3EE;
  font-size:15px;font-weight:600;
}
.envoyer:hover{background:#2A5341}
.calmassif{margin-bottom:14px}
.calmassif .flabel{margin-bottom:6px}
.calbar{display:flex;gap:2px;height:22px;align-items:flex-end}
.calbar i{flex:1;background:#E4E1D6;border-radius:2px;height:4px;transition:height .2s}
.calbar i[data-n]{background:var(--ocre)}
.trou{font-size:12.5px;color:var(--encre-2);margin-top:6px;line-height:1.45}

@media(max-width:900px){
  #filtres{position:fixed;inset:52px 0 0 0;z-index:30;flex:none;width:100%;display:none}
  #filtres.on{display:block}
  header .sub{display:none}
}

/* ============ Document de proposition ============ */
#doc{
  position:fixed;inset:0;z-index:80;background:#6E7670;overflow-y:auto;display:none;
}
#doc.on{display:block}
.docbar{
  position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;
  padding:11px 18px;background:var(--vert);color:#EDF0EA;
}
.docbar .t{font-size:14px;font-weight:600}
.docbar button{
  padding:9px 15px;border-radius:8px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.14);color:#EDF0EA;
}
.docbar button:hover{background:rgba(255,255,255,.24)}
.docbar button.pri{background:#F1F3EE;color:var(--vert)}
.docbar button.pri:hover{background:#fff}
.page{
  background:#fff;max-width:800px;margin:22px auto;padding:38px 44px 46px;
  box-shadow:0 6px 30px rgba(0,0,0,.22);color:#14201A;
}
.dh{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;
  border-bottom:2px solid var(--vert);padding-bottom:16px;margin-bottom:20px}
.dh .ent{font-size:19px;font-weight:700;line-height:1.2}
.dh .coord{font-size:12px;color:var(--encre-2);line-height:1.6;margin-top:5px}
.dh .droite{text-align:right;font-size:12px;color:var(--encre-2);line-height:1.7}
.dh .droite b{display:block;font-size:15px;color:var(--encre);margin-bottom:3px}
[contenteditable]{outline:0}
[contenteditable]:hover{background:#FBF6E6;border-radius:3px}
[contenteditable]:focus{background:#FDF6E7;box-shadow:0 0 0 2px #EBD9AE;border-radius:3px}
.dtitre{font-size:22px;font-weight:700;margin:0 0 4px}
.dsstitre{font-size:13.5px;color:var(--encre-2);margin:0 0 22px}
.dsec{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--encre-2);margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--ligne)}
table.dev{width:100%;border-collapse:collapse;font-size:12.5px}
table.dev th{
  text-align:left;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--encre-2);font-weight:700;padding:0 6px 7px;border-bottom:1px solid var(--ligne);
}
table.dev th.r,table.dev td.r{text-align:right}
table.dev td{padding:8px 6px;border-bottom:1px solid #EDEBE2;vertical-align:top}
table.dev .n1{font-weight:600;font-size:13px}
table.dev .n2{font-size:11px;color:var(--encre-2)}
.totaux{margin-top:14px;margin-left:auto;width:280px;font-size:13px}
.totaux div{display:flex;justify-content:space-between;padding:5px 0}
.totaux .gd{border-top:2px solid var(--vert);margin-top:5px;padding-top:9px;
  font-size:16px;font-weight:700}
.dcal{display:flex;gap:3px;height:26px;align-items:flex-end;margin-top:4px}
.dcal i{flex:1;background:#E4E1D6;border-radius:2px}
.dcal i.on{background:var(--ocre)}
.dcal-lab{display:flex;gap:3px;font-size:9px;color:var(--encre-2);margin-top:3px}
.dcal-lab span{flex:1;text-align:center}
.fichetec{
  border:1px solid var(--ligne);border-radius:8px;padding:13px 15px;margin-bottom:11px;
  break-inside:avoid;page-break-inside:avoid;
}
.fichetec h4{margin:0;font-size:15px;font-weight:700}
.fichetec .sl{font-size:12.5px;color:var(--encre-2);margin-bottom:9px}
.fichetec .gr{display:grid;grid-template-columns:repeat(4,1fr);gap:7px 14px;font-size:11.5px;margin-bottom:9px}
.fichetec .gr dt{color:var(--encre-2);font-size:10px}
.fichetec .gr dd{margin:0;font-weight:500}
.fichetec p{margin:0 0 5px;font-size:12px;line-height:1.5}
.fichetec p.ent{color:#5A4A20}
.mentions{margin-top:24px;padding-top:14px;border-top:1px solid var(--ligne);
  font-size:11px;color:var(--encre-2);line-height:1.65}
.reglages{
  background:#EFEDE4;border:1px solid var(--ligne);border-radius:8px;
  padding:12px 14px;margin:0 auto 0;max-width:800px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;
}
.reglages label{font-size:11px;color:var(--encre-2);display:flex;flex-direction:column;gap:4px}
.reglages input[type=number]{width:92px;padding:8px 9px;border:1px solid var(--ligne);
  border-radius:7px;font:inherit;font-size:14px;background:#fff}
.reglages .info{flex:1;min-width:220px;font-size:12px;line-height:1.45;color:var(--encre-2)}

@media print{
  body{overflow:visible;background:#fff}
  #app,#voile,#fiche,#panier,#favoris,#pop,.docbar,.reglages{display:none !important}
  #doc{position:static;background:#fff;overflow:visible;display:block}
  .page{box-shadow:none;margin:0;max-width:none;padding:0}
  [contenteditable]:hover,[contenteditable]:focus{background:none;box-shadow:none}
  @page{margin:16mm 14mm}
}

.docbar .modes{display:flex;gap:2px;background:rgba(0,0,0,.18);padding:2px;border-radius:9px}
.docbar .modes button{padding:7px 14px;border-radius:7px;background:none;font-size:12.5px}
.docbar .modes button.act{background:#F1F3EE;color:var(--vert)}
.interne{
  background:#FBEDE8;border:1px solid #E4BFB2;color:#8A3A1E;border-radius:6px;
  padding:8px 12px;font-size:11.5px;font-weight:600;margin-bottom:18px;
  letter-spacing:.03em;text-transform:uppercase;
}
.intro{font-size:13.5px;line-height:1.6;margin:0 0 4px;color:#3A4640}

/* ---------- identité de marque sur le document ---------- */
.page{--m:#1F3D30;--a:#6F8F3F}
.page .dh{border-bottom-color:var(--m)}
.page .dsec{color:#5A6660}
.page .dtitre{color:var(--m)}
.page .totaux .gd{border-top-color:var(--m)}
.page .dcal i.on{background:var(--a)}
.dh .ident{max-width:62%}
.dh .logo{display:block;max-width:230px;object-fit:contain;margin-bottom:7px}
.legal{
  margin-top:18px;padding-top:11px;border-top:1px solid var(--ligne);
  font-size:10px;color:#8A918C;text-align:center;letter-spacing:.02em;
}

/* ---------- charte Loire Aménagement ---------- */
.page{--a2:#3BACD4}
.dh .bl{
  font-family:Spectral,Georgia,serif;font-style:italic;
  color:var(--a2);font-size:14px;margin:2px 0 8px;
}
.page .dsec{
  color:var(--m);border-bottom-color:var(--m);
}
.page .dtitre{color:var(--m)}
.page table.dev th{color:var(--m)}
.page .fichetec h4{color:var(--m)}
.page .fichetec{border-left:3px solid var(--a)}
.page .intro{border-left:3px solid var(--a2);padding-left:12px}

</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Sélection végétale</h1>
    <span class="sub">Catalogue AD.V Production 2026/27</span>
    <span class="spacer"></span>
    <button class="hbtn" id="btn-filtres" style="display:none">Filtres</button>
    <button class="hbtn" id="btn-favoris">

/* ---------- filtres ---------- */
const F = {
  q:'', type:new Set(), expo:new Set(), sol:new Set(), hum:new Set(),
  feu:new Set(), ent:new Set(), plant:new Set(), mois:new Set(), bdm:new Set(),
  rust:0, hmax:20
};

const OPTIONS = {
  type:['Arbre','Arbuste','Conifère','Couvre-sol','Vivace','Graminée','Grimpante','Fruitier','Aromatique'],
  expo:['Plein soleil','Mi-ombre','Ombre'],
  sol:['Drainé','Frais','Sec','Calcaire toléré','Acide','Argileux toléré','Pauvre toléré','Humifère','Profond'],
  hum:['Sec','Frais','Humide'],
  feu:['Persistant','Semi-persistant','Caduc'],
  ent:['Faible','Moyen','Soutenu'],
  plant:['Automne','Printemps'],
  bdm:['Front de mer','Second rideau']
};

function bâtirFiltres(){
  const el = document.getElementById('filtres');
  const g = (label, cle, opts, cls='') => `
    <div class="fgroup">
      <span class="flabel">${label}</span>
      <div class="chips" data-cle="${cle}">
        ${opts.map(o=>`<button class="chip ${cls}" data-v="${o}">${o}</button>`).join('')}
      </div>
    </div>`;
  el.innerHTML = `
    <div class="fgroup">
      <input type="search" id="q" placeholder="Nom latin ou français…" autocomplete="off">
    </div>
    ${g('Type de végétal','type',OPTIONS.type)}
    ${g('Exposition','expo',OPTIONS.expo)}
    ${g('Nature de sol','sol',OPTIONS.sol)}
    ${g('Humidité du sol','hum',OPTIONS.hum)}
    <div class="fgroup">
      <span class="flabel">Rusticité minimale</span>
      <input type="range" id="rust" min="-30" max="-8" step="1" value="0">
      <div class="rangeval"><span>Doit tenir jusqu'à</span><b id="rustv">indifférent</b></div>
    </div>
    <div class="fgroup">
      <span class="flabel">Hauteur adulte maximale</span>
      <input type="range" id="hmax" min="0.2" max="20" step="0.1" value="20">
      <div class="rangeval"><span>Pas plus de</span><b id="hmaxv">indifférent</b></div>
    </div>
    ${g('Exposition au littoral','bdm',OPTIONS.bdm)}
    ${g('Feuillage','feu',OPTIONS.feu)}
    <div class="fgroup">
      <span class="flabel">En fleurs en…</span>
      <div class="chips" data-cle="mois">
        ${MOIS.map((m,i)=>`<button class="chip mois" data-v="${i+1}">${m}</button>`).join('')}
      </div>
    </div>
    ${g('Se plante en','plant',OPTIONS.plant)}
    ${g("Niveau d'entretien",'ent',OPTIONS.ent)}
    <button id="reset">Effacer les filtres</button>`;

  el.addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    const cle = b.parentElement.dataset.cle;
    const v = cle==='mois' ? +b.dataset.v : b.dataset.v;
    F[cle].has(v) ? F[cle].delete(v) : F[cle].add(v);
    b.classList.toggle('on');
    rendre();
  });
  document.getElementById('q').addEventListener('input', e=>{F.q=e.target.value.toLowerCase();rendre();});
  const rust = document.getElementById('rust');
  rust.value = -8; rust.addEventListener('input', e=>{
    F.rust = +e.target.value;
    document.getElementById('rustv').textContent = F.rust<=-8 && F.rust>-9 ? 'indifférent' : F.rust+' °C';
    if(F.rust===-8){F.rust=0;document.getElementById('rustv').textContent='indifférent';}
    rendre();
  });
  const hm = document.getElementById('hmax');
  hm.addEventListener('input', e=>{
    F.hmax = +e.target.value;
    document.getElementById('hmaxv').textContent = F.hmax>=20 ? 'indifférent' : F.hmax.toFixed(1).replace('.',',')+' m';
    rendre();
  });
  document.getElementById('reset').addEventListener('click', ()=>{
    F.q=''; ['type','expo','sol','hum','feu','ent','plant','mois','bdm'].forEach(k=>F[k].clear());
    F.rust=0; F.hmax=20;
    el.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
    document.getElementById('q').value='';
    rust.value=-8; hm.value=20;
    document.getElementById('rustv').textContent='indifférent';
    document.getElementById('hmaxv').textContent='indifférent';
    rendre();
  });
}

/* ---------- logique de floraison ---------- */
function moisFloraison(p){
  if(!p.m1 || !p.m2) return [];
  const out=[]; let m=p.m1;
  for(let i=0;i<13;i++){ out.push(m); if(m===p.m2) break; m = m===12 ? 1 : m+1; }
  return out;
}

/* ---------- filtrage ---------- */
function correspond(p){
  if(F.q){
    const t = (p.lat+' '+p.fr).toLowerCase();
    if(!t.includes(F.q)) return false;
  }
  if(F.type.size && ![...F.type].some(v=>p.type.includes(v))) return false;
  if(F.expo.size && ![...F.expo].some(v=>p.expo.includes(v))) return false;
  if(F.sol.size && ![...F.sol].some(v=>p.sol.toLowerCase().includes(v.toLowerCase().split(' ')[0]))) return false;
  if(F.hum.size && ![...F.hum].some(v=>p.hum.includes(v))) return false;
  if(F.bdm.size){
    const rang = {'Front de mer':2,'Second rideau':1,'Déconseillé en bord de mer':0};
    const exige = Math.max(...[...F.bdm].map(v=>rang[v]));
    if(rang[p.bdm] < exige) return false;
  }
  if(F.feu.size && !F.feu.has(p.feu)) return false;
  if(F.ent.size && !F.ent.has(p.ent)) return false;
  if(F.plant.size && ![...F.plant].some(v=>p.plant.includes(v))) return false;
  if(F.mois.size){
    const mf = moisFloraison(p);
    if(![...F.mois].every(m=>mf.includes(m))) return false;
  }
  if(F.rust && p.rust > F.rust) return false;
  if(F.hmax<20 && p.h > F.hmax) return false;
  return true;
}

/* ---------- rendu liste ---------- */
function frise(p, cls=''){
  const mf = moisFloraison(p);
  if(!mf.length) return '';
  return `<div class="frise ${cls}">${MOIS.map((_,i)=>`<i class="${mf.includes(i+1)?'on':''}"></i>`).join('')}</div>`;
}

function rendre(){
  const res = DATA.filter(correspond);
  document.getElementById('nb').textContent = res.length;
  document.getElementById('nbt').textContent =
    res.length>1 ? 'espèces correspondent' : (res.length===1?'espèce correspond':'');
  const g = document.getElementById('grille');
  if(!res.length){
    g.innerHTML = `<div class="vide"><b>Aucune espèce ne coche toutes ces cases.</b>
      Retirez un critère pour élargir la recherche — la rusticité et l'humidité du sol
      sont souvent les plus restrictives.</div>`;
    return;
  }
  g.innerHTML = res.map(p=>`
    <div class="cwrap">
    <button class="carte" data-lat="${p.lat}">
      <div>
        <div class="nom">${p.fr}</div>
        <div class="lat">${p.lat}</div>
      </div>
      <div class="meta">
        <span>${p.type}</span><span>${fmt(p.h)} × ${fmt(p.l)} m</span>
        <span>${p.rust} °C</span><span>${p.feu}</span>
        ${p.bdm==='Front de mer'?'<span style="color:var(--mousse);font-weight:600">Front de mer</span>':''}
      </div>
      ${frise(p)}
      <div class="prix">${prixMin(p)} <span>HT · ${p.refs.length} calibre${p.refs.length>1?'s':''}</span></div>
    </button>
    <button class="star ${estFavori(p.lat)?'on':''}" data-lat="${p.lat}" aria-label="Ajouter aux favoris">${estFavori(p.lat)?'★':'☆'}</button>
    </div>`).join('');
}
const fmt = n => String(n).replace('.',',');
const dens = d => d>=1 ? fmt(d)+' sujets/m²' : fmt(Math.round(10/d)/10)+' m² par sujet';
const eur = n => n.toFixed(2).replace('.',',')+' €';
const prixMin = p => eur(Math.min(...p.refs.map(r=>r.px)));

document.getElementById('grille').addEventListener('click', e=>{
  const st = e.target.closest('.star');
  if(st){ ouvrirPop(st, st.dataset.lat); return; }
  const c = e.target.closest('.carte'); if(!c) return;
  ouvrirFiche(DATA.find(p=>p.lat===c.dataset.lat));
});

/* ---------- popover de classement ---------- */
function ouvrirPop(anchor, lat){
  const pop = document.getElementById('pop');
  pop.innerHTML = `<div class="ptit">Classer dans…</div>` +
    COLLECTIONS.map(c=>`<button data-c="${c.id}">
      <span class="tick">${c.items.includes(lat)?'✓':''}</span>${c.nom}</button>`).join('') +
    `<button class="neuf" data-c="new">+ Nouvelle collection</button>`;
  const r = anchor.getBoundingClientRect();
  pop.style.visibility='hidden'; pop.classList.add('on');
  const h = pop.offsetHeight, w = pop.offsetWidth;
  pop.style.top  = Math.min(r.bottom+6, innerHeight-h-10)+'px';
  pop.style.left = Math.max(10, Math.min(r.right-w, innerWidth-w-10))+'px';
  pop.style.visibility='visible';
  pop.onclick = e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.c==='new'){
      const nom = prompt('Nom de la collection', 'Nouvelle collection');
      if(nom && nom.trim()){
        COLLECTIONS.push({id:idColl++, nom:nom.trim(), items:[lat]});
      }
    } else {
      const c = COLLECTIONS.find(x=>x.id === +b.dataset.c);
      const i = c.items.indexOf(lat);
      i>=0 ? c.items.splice(i,1) : c.items.push(lat);
    }
    fermerPop(); majCompteurFav(); rendre();
    if(document.getElementById('favoris').classList.contains('on')) ouvrirFavoris();
  };
}
function fermerPop(){ document.getElementById('pop').classList.remove('on'); }
document.addEventListener('click', e=>{
  if(!e.target.closest('#pop') && !e.target.closest('.star')) fermerPop();
}, true);

/* ---------- panneau favoris ---------- */

  const el = document.getElementById('favoris');
  const corps = COLLECTIONS.length ? COLLECTIONS.map(c=>`
    <div class="coll" data-c="${c.id}">
      <div class="chead">
        <h4>${c.nom}</h4>
        <span class="n">${c.items.length}</span>
        ${c.items.length?`<button class="all" data-a="all">Tout ajouter</button>`:''}
      </div>
      ${c.items.length ? c.items.map(lat=>{
        const p = DATA.find(x=>x.lat===lat); if(!p) return '';
        return `<div class="fitem" data-lat="${lat}">
          <div class="txt2">
            <div class="n1">${p.fr}</div>
            <div class="n2"><span class="lat">${p.lat}</span> · ${p.type} · ${prixMin(p)} HT</div>
          </div>
          <button class="mini" data-a="add">Ajouter</button>

        </div>`;
      }).join('') : `<p class="txt gris" style="font-size:13px;margin:0">

    </div>`).join('') : '';

  el.innerHTML = `
    <div class="phead">
      <h2>Mes favoris</h2>
      <span class="spacer"></span>
      <button class="fclose" style="position:static" aria-label="Fermer">✕</button>
    </div>
    <div class="plist">
      ${corps}
      <button class="newcoll">+ Créer une collection</button>
    </div>`;

  el.querySelector('.fclose').onclick = fermerFavoris;
  el.querySelector('.newcoll').onclick = ()=>{
    const nom = prompt('Nom de la collection', '');
    if(nom && nom.trim()){ COLLECTIONS.push({id:idColl++, nom:nom.trim(), items:[]}); ouvrirFavoris(); }
  };
  el.querySelector('.plist').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b || !b.dataset.a) return;
    const coll = COLLECTIONS.find(x=>x.id === +b.closest('.coll').dataset.c);
    if(b.dataset.a==='all'){
      coll.items.forEach(lat=>{
        const p = DATA.find(x=>x.lat===lat);
        if(p) ajouter(p, p.refs[0], 1);
      });
      b.textContent = 'Ajouté'; setTimeout(()=>{b.textContent='Tout ajouter';},1100);
      return;
    }
    const lat = b.closest('.fitem').dataset.lat;
    const p = DATA.find(x=>x.lat===lat);
    if(b.dataset.a==='add'){
      ajouter(p, p.refs[0], 1);

      setTimeout(()=>{b.textContent='Ajouter';b.style.background='';b.style.color='';},1100);
    } else {
      coll.items = coll.items.filter(x=>x!==lat);
      majCompteurFav(); rendre(); ouvrirFavoris();
    }
  });

  el.classList.add('on'); el.setAttribute('aria-hidden','false');
  document.getElementById('voile').classList.add('on');
}
function fermerFavoris(){
  document.getElementById('favoris').classList.remove('on');

}

/* ---------- panier ---------- */
let PANIER = [];
function cle(p,r){return p.lat+'|'+r.cv+'|'+r.ct+'|'+r.tl}
function ajouter(p,r,q=1){
  const k = cle(p,r);
  const ex = PANIER.find(x=>x.k===k);
  if(ex) ex.q += q;
  else PANIER.push({k, lat:p.lat, fr:p.fr, m1:p.m1, m2:p.m2, cv:r.cv, ct:r.ct,
                    tl:r.tl, px:r.px, q, dens:p.dens});
  majCompteur();
}
function majCompteur(){
  const n = PANIER.reduce((s,x)=>s+x.q,0);
  document.getElementById('cpt').textContent = n;
}
function totalHT(){return PANIER.reduce((s,x)=>s+x.px*x.q,0)}

function ouvrirPanier(){
  const el = document.getElementById('panier');
  const items = PANIER.length ? PANIER.map(x=>`
    <div class="pitem" data-k="${x.k}">
      <div class="info">
        <div class="nom">${x.fr}</div>
        <div class="det"><span class="lat">${x.lat}</span>${x.cv?' '+x.cv:''} · ${x.ct}${x.tl?' · '+x.tl:''}</div>
        <div class="qty">
          <button data-a="-">−</button>
          <input type="number" min="1" value="${x.q}" data-a="set">
          <button data-a="+">+</button>
        </div>
        <div class="det" style="margin-top:5px">≈ ${fmt(Math.round(x.q/x.dens*10)/10)} m² couverts</div>
        <div class="sup" data-a="sup">Retirer</div>
      </div>
      <div class="tot">${eur(x.px*x.q)}<br><span style="font-weight:400;font-size:11.5px;color:var(--encre-2)">${eur(x.px)} l'unité</span></div>
    </div>`).join('') : `<div class="vide"><b>La sélection est vide.</b>
      Ouvrez une fiche et ajoutez un calibre pour composer la proposition du client.</div>`;

  /* calendrier agrege */
  const counts = new Array(12).fill(0);
  PANIER.forEach(x=>{
    if(!x.m1||!x.m2) return;
    let m=x.m1;
    for(let i=0;i<13;i++){counts[m-1]++; if(m===x.m2)break; m = m===12?1:m+1;}
  });
  const max = Math.max(1,...counts);
  const trous = counts.map((c,i)=>c===0?MOIS_LONG[i]:null).filter(Boolean);

  el.innerHTML = `
    <div class="phead">
      <h2>Sélection pour le client</h2>
      <span class="spacer"></span>
      <button class="fclose" style="position:static" aria-label="Fermer">✕</button>

    <div class="plist">${items}</div>
    <div class="pfoot">
      ${PANIER.length?`
      <div class="calmassif">
        <span class="flabel">Échelonnement des floraisons</span>
        <div class="calbar">
          ${counts.map(c=>`<i ${c?`data-n="${c}"`:''} style="height:${c?4+(c/max)*18:4}px" title="${c} espèce(s)"></i>`).join('')}
        </div>
        <div class="frise-lab">${MOIS.map(m=>`<span>${m}</span>`).join('')}</div>
        ${trous.length && trous.length<12 ? `<p class="trou">Aucune floraison prévue en ${trous.join(', ')}. Un arbuste à floraison hivernale ou une graminée à épis persistants comblerait ce creux.</p>`:''}
      </div>`:''}
      <div class="ligne-tot"><span>${PANIER.reduce((s,x)=>s+x.q,0)} sujets · ${PANIER.length} référence${PANIER.length>1?'s':''}</span><span>≈ ${fmt(Math.round(PANIER.reduce((s,x)=>s+x.q/x.dens,0)))} m² plantés</span></div>
      <div class="ligne-tot grand"><span>Total HT</span><span>${eur(totalHT())}</span></div>
      <button class="envoyer">Générer la proposition</button>
    </div>`;

  el.querySelector('.fclose').onclick = fermerPanier;
  el.querySelector('.envoyer').onclick = ()=>{
    if(!PANIER.length){ alert("Ajoutez au moins une plante avant de générer la proposition."); return; }
    fermerPanier(); ouvrirDocument();
  };
  el.querySelector('.plist').addEventListener('click', e=>{
    const it = e.target.closest('.pitem'); if(!it) return;
    const a = e.target.dataset.a; if(!a) return;
    const x = PANIER.find(z=>z.k===it.dataset.k);
    if(a==='+') x.q++;
    else if(a==='-') x.q = Math.max(1,x.q-1);
    else if(a==='sup') PANIER = PANIER.filter(z=>z.k!==x.k);
    majCompteur(); ouvrirPanier();
  });
  el.querySelector('.plist').addEventListener('change', e=>{
    if(e.target.dataset.a!=='set') return;
    const it = e.target.closest('.pitem');
    const x = PANIER.find(z=>z.k===it.dataset.k);
    x.q = Math.max(1, parseInt(e.target.value)||1);
    majCompteur(); ouvrirPanier();
  });

  el.classList.add('on'); el.setAttribute('aria-hidden','false');
  document.getElementById('voile').classList.add('on');
}
function fermerPanier(){
  document.getElementById('panier').classList.remove('on');
  document.getElementById('voile').classList.remove('on');
}
document.getElementById('btn-panier').onclick = ouvrirPanier;

        <div><dt>Plantation</dt><dd>${p.popt}</dd></div>
      </dl>
      <p><b>Situation :</b> ${p.style}.</p>
      <p><b>Associations :</b> ${p.asso}.</p>
      <p class="ent"><b>Entretien (${p.ent.toLowerCase()}) :</b> ${p.cons}</p>
    </div>`).join('');

  /* ---- totaux, uniquement en interne ---- */
  const totaux = client ? '' : `
      <div class="totaux">
        <div><span>Coût d'achat des végétaux HT</span><span>${eur(totalAchat)}</span></div>
        <div><span>Valeur de vente (coef. ${fmt(CFG.coef)})</span><span>${eur(totalVente)}</span></div>
        <div><span>Marge brute</span><span>${eur(totalVente - totalAchat)}</span></div>
        <div class="gd"><span>À reporter au devis, poste végétaux HT</span><span>${eur(totalVente)}</span></div>
      </div>`;

  /* ---- reglages, uniquement en interne ---- */
  const reglages = client ? '' : `
    <div style="padding:16px 18px 0">
      <div class="reglages">
        <label>Coefficient de vente
          <input type="number" id="r-coef" min="1" max="6" step="0.05" value="${CFG.coef}">
        </label>
        <div class="info">Les prix du catalogue sont vos prix d'achat. Le coefficient donne
          le montant à reporter au poste végétaux de votre devis global.
          Ce récapitulatif est un document de travail : il ne doit pas être transmis au client.</div>
      </div>
    </div>`;

  const bandeau = client ? '' : `
      <div class="interne">Document interne — ne pas transmettre au client</div>`;

  doc.innerHTML = `
    <div class="docbar">
      <span class="t">${client ? 'Proposition client' : 'Récapitulatif chantier'} · ${REF}</span>
      <div class="modes">
        <button class="${client?'act':''}" data-mode="client">Client</button>
        <button class="${client?'':'act'}" data-mode="interne">Interne</button>
      </div>
      <span class="spacer"></span>
      <button id="d-fermer">Fermer</button>
      ${client?'<button id="d-mail">Préparer l\'email</button>':''}
      <button class="pri" id="d-pdf">Imprimer / Enregistrer en PDF</button>
    </div>

    ${reglages}

    <div class="page" style="--m:${MARQUE.couleur};--a:${MARQUE.accent};--a2:${MARQUE.accent2}">
      ${bandeau}
      <div class="dh">
        <div class="ident">
          ${MARQUE.logo
            ? `<img class="logo" src="${MARQUE.logo}" alt="${MARQUE.nom}"
                 style="height:${MARQUE.logoHauteur}px"
                 onerror="this.outerHTML='<div class=\'ent\'>${MARQUE.nom}</div>'">`
            : `<div class="ent">${MARQUE.nom}</div>`}
          <div class="bl">${MARQUE.baseline}</div>
          <div class="coord" contenteditable="true">
            ${MARQUE.gerant}${MARQUE.fonction?', '+MARQUE.fonction.toLowerCase():''}<br>
            ${MARQUE.coord.join('<br>')}
          </div>
        </div>
        <div class="droite">
          <b contenteditable="true">${CLIENT.nom}</b>
          <span contenteditable="true">${CLIENT.chantier}</span><br>
          ${dateFr()}<br>Réf. ${REF}
        </div>
      </div>

      <h1 class="dtitre">${client ? 'Palette végétale proposée' : 'Récapitulatif des végétaux'}</h1>
      <p class="dsstitre">${nbSujets} sujets · ${especes.length} espèces · environ ${fmt(Math.round(surface))} m² plantés</p>

      ${client ? `<p class="intro">Cette palette a été composée pour les conditions de votre terrain :
        exposition, nature du sol et entretien souhaité. Chaque espèce est présentée en détail
        dans les fiches qui suivent. Le chiffrage de ces plantations figure au devis d'aménagement.</p>` : ''}

      <div class="dsec">${client ? 'Composition de la palette' : 'Détail par référence'}</div>
      <table class="dev">
        <thead>${client ? enteteClient : enteteInterne}</thead>
        <tbody>${lignes}</tbody>
      </table>
      ${totaux}

      <div class="dsec">Échelonnement des floraisons sur l'année</div>
      <div class="dcal">
        ${counts.map(c=>`<i class="${c?'on':''}" style="height:${c?5+(c/Math.max(1,...counts))*20:5}px"></i>`).join('')}
      </div>
      <div class="dcal-lab">${MOIS_LONG.map(m=>`<span>${m.slice(0,1).toUpperCase()}</span>`).join('')}</div>
      <p style="font-size:11.5px;color:var(--encre-2);margin-top:8px;line-height:1.5">
        ${trous.length && trous.length<12
          ? `Cette palette ne présente pas de floraison en ${trous.join(', ')}. Un arbuste à floraison hivernale ou une graminée à épis persistants comblerait ce creux.`
          : `Cette palette assure une présence florale sur l'ensemble de l'année.`}
      </p>

      <div class="dsec">Fiches techniques des espèces retenues</div>
      ${fiches}

      <div class="mentions" contenteditable="true">
        ${client
          ? `Les végétaux sont fournis dans les conditionnements indiqués ; les tailles peuvent
             varier légèrement selon les disponibilités de la pépinière au moment de la commande.
             La reprise suppose une préparation du sol adaptée, un arrosage suivi la première année
             et le respect des périodes de plantation mentionnées sur les fiches. Les surfaces
             indiquées correspondent aux densités de plantation habituelles et peuvent être ajustées
             selon l'effet recherché. Palette susceptible d'évoluer selon les disponibilités
             en pépinière au moment de la commande.`
          : `Prix d'achat HT du premier palier de quantité, catalogue AD.V Production 2026/2027.
             Des tarifs dégressifs s'appliquent aux quantités supérieures : vérifier les seuils
             avant commande. Disponibilités à confirmer auprès du fournisseur.`}
      </div>
      ${MARQUE.legal ? `<div class="legal">${MARQUE.legal}</div>` : ''}
    </div>`;

  doc.querySelector('.modes').onclick = e=>{
    const b = e.target.closest('button'); if(!b) return;
    CFG.mode = b.dataset.mode; ouvrirDocument();
  };
  if(!client){
    document.getElementById('r-coef').addEventListener('change', e=>{
      CFG.coef = Math.max(1, parseFloat(e.target.value)||1);
      ouvrirDocument();
    });
  }
  document.getElementById('d-fermer').onclick = fermerDocument;
  document.getElementById('d-pdf').onclick = ()=>window.print();
  const mail = document.getElementById('d-mail');
  if(mail) mail.onclick = ()=>{
    const corps =
`Bonjour,

Vous trouverez ci-joint la palette végétale proposée pour votre projet.

Elle comprend ${nbSujets} sujets répartis sur ${especes.length} espèces, pour environ ${fmt(Math.round(surface))} m² plantés.

Chaque espèce est accompagnée de sa fiche technique : conditions de culture, période de plantation et conseils d'entretien. Le chiffrage de ces plantations figure au devis d'aménagement.

Je reste à votre disposition pour en discuter.

Cordialement,

${MARQUE.gerant}
${MARQUE.nom} — ${MARQUE.baseline}
${MARQUE.coord.join(' · ')}`;
    location.href = 'mailto:?subject=' + encodeURIComponent('Palette végétale — ' + REF) +
                    '&body=' + encodeURIComponent(corps);
  };

  doc.classList.add('on');
  doc.scrollTop = 0;
}

function fermerDocument(){ document.getElementById('doc').classList.remove('on'); }

</script>
</body>
</html>
