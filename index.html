<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3D30">
<title>Sélection végétale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Sélection végétale</h1>
    <span class="sub">Catalogue AD.V Production 2026/27</span>
    <span class="spacer"></span>
    <button class="hbtn" id="btn-filtres" style="display:none">Filtres</button>
    <button class="hbtn" id="btn-favoris">
      Favoris <span class="count" id="cptf" style="background:#A9BBAF;color:#16261D">0</span>
    </button>
    <button class="hbtn" id="btn-panier">
      Sélection <span class="count" id="cpt">0</span>
    </button>
  </header>

  <main>
    <aside id="filtres"></aside>
    <section id="resultats">
      <div class="barre"><span class="n" id="nb">—</span><span class="t" id="nbt"></span></div>
      <div class="grille" id="grille"></div>
    </section>
  </main>
</div>

<div id="voile"></div>
<aside id="fiche" aria-hidden="true"></aside>
<aside id="favoris" aria-hidden="true"></aside>
<aside id="panier" aria-hidden="true"></aside>
<div id="pop"></div>
<div id="doc" aria-hidden="true"></div>

<script src="data/plantes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
